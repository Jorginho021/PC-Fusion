<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PC Fusion - Montar PC</title>
  <link rel="stylesheet" href="styles1.css">
</head>
<body>
  <header>
    <div class="header-container">
      <img src="LogoPc.jpg" alt="Logo do PC Fusion" class="logo">
      <h1>PC Fusion</h1>
    </div>
    <nav>
      <a href="index.html">Home</a>
      <a href="build.html">Montar PC</a>
      <a href="pecas.html">Peças</a>
         <a href="Videos.html">Vídeos</a>
      <a href="Sobre.html">Sobre</a>
      <a href="desenvolvedores.html">Nós</a>
    </nav>
  </header>

  <main>
    <section id="montar-pc">
      <h2>Montar seu PC</h2>
      <p>Escolha suas peças e veja se são compatíveis!</p>

      <div class="opcoes-montagem">
        <!-- CPU -->
        <div class="opcao">
          <label>CPU:</label>
          <select id="cpu">
            <option value="">Selecione</option>
            <!-- Intel -->
            <option value="Intel Core i5 12ª">Intel Core i5 12ª</option>
            <option value="Intel Core i7 12ª">Intel Core i7 12ª</option>
            <option value="Intel Core i9 13ª">Intel Core i9 13ª</option>
            <option value="Intel Core i3 11ª">Intel Core i3 11ª</option>
            <!-- AMD -->
            <option value="AMD Ryzen 5 5600X">AMD Ryzen 5 5600X</option>
            <option value="AMD Ryzen 7 5800X">AMD Ryzen 7 5800X</option>
            <option value="AMD Ryzen 9 5900X">AMD Ryzen 9 5900X</option>
            <option value="AMD Ryzen 3 5300G">AMD Ryzen 3 5300G</option>
            <!-- Nova marca MSI -->
            <option value="MSI Ryzen 5 7600">MSI Ryzen 5 7600</option>
            <option value="MSI Ryzen 7 7700">MSI Ryzen 7 7700</option>
            <option value="MSI Intel i5 13600K">MSI Intel i5 13600K</option>
            <option value="MSI Intel i7 13700K">MSI Intel i7 13700K</option>
          </select>
        </div>

        <!-- Placa-mãe -->
        <div class="opcao">
          <label>Placa-mãe:</label>
          <select id="placaMae">
            <option value="">Selecione</option>
            <!-- Aorus -->
            <option value="Aorus Z690">Aorus Z690</option>
            <option value="Aorus B550">Aorus B550</option>
            <option value="Aorus X570">Aorus X570</option>
            <option value="Aorus H610">Aorus H610</option>
            <!-- Intel -->
            <option value="Intel Z790">Intel Z790</option>
            <option value="Intel B660">Intel B660</option>
           
            <option value="Intel Z590">Intel Z590</option>
            <!-- Nova marca MSI -->
            <option value="MSI B650">MSI B650</option>
            <option value="MSI X670">MSI X670</option>
            <option value="MSI Z690">MSI Z690</option>
            <option value="MSI H610">MSI H610</option>
          </select>
        </div>

        <!-- RAM -->
        <div class="opcao">
          <label>RAM:</label>
          <select id="ram">
            <option value="">Selecione</option>
            <!-- DDR4/DDR5 das marcas -->
            <option value="DDR4 3200MHz Intel">DDR4 3200MHz Intel</option>
            <option value="DDR4 3600MHz AMD">DDR4 3600MHz AMD</option>
            <option value="DDR5 5200MHz Aorus">DDR5 5200MHz Aorus</option>
            <option value="DDR5 6000MHz MSI">DDR5 6000MHz MSI</option>
          </select>
        </div>

        <!-- GPU -->
        <div class="opcao">
          <label>GPU:</label>
          <select id="gpu">
            <option value="">Selecione</option>
            <!-- Marcas -->
            <option value="Nvidia RTX 3060">Nvidia RTX 3060</option>
            <option value="Nvidia RTX 4070">Nvidia RTX 4070</option>
            <option value="AMD RX 6700">AMD RX 6700</option>
            <option value="AMD RX 7900">AMD RX 7900</option>
          </select>
        </div>

        <!-- SSD -->
        <div class="opcao">
          <label>SSD:</label>
          <select id="ssd">
            <option value="">Selecione</option>
            <option value="SATA 1TB">SATA 1TB</option>
            <option value="SATA 2TB">SATA 2TB</option>
            <option value="NVMe 500GB">NVMe 500GB</option>
            <option value="NVMe 1TB">NVMe 1TB</option>
          </select>
        </div>

        <!-- Fonte -->
        <div class="opcao">
          <label>Fonte:</label>
          <select id="fonte">
            <option value="">Selecione</option>
            <option value="550W">550W</option>
            <option value="650W">650W</option>
            <option value="750W">750W</option>
            <option value="850W">850W</option>
          </select>
        </div>
<!-- Fan-->
<div class="opcao">
  <label>Cooler:</label>
  <select id="Fan">
    <option value="">Selecione</option>
    <option value="Cooler Master SickleFlow">Cooler Master SickleFlow</option>
    <option value="Corsair AF Series">Corsair AF Series</option>
    <option value="Noctua NF-F12">Noctua NF-F12</option>
    <option value="Thermaltake Riing">Thermaltake Riing</option>
  </select>
</div>

<!-- Gabinete-->
<div class="opcao">
  <label>Gabinete:</label>
  <select id="Gabinete">
    <option value="">Selecione</option>
    <option value="Lian Li Lancool II">Lian Li Lancool II</option>
    <option value="NZXT H510">NZXT H510</option>
    <option value="Cooler Master MasterBox MB520">Cooler Master MasterBox MB520</option>
    <option value="Corsair iCUE 4000X">Corsair iCUE 4000X</option>
  </select>
</div>
        <button id="verificar">Verificar Compatibilidade</button>

        <p id="resultado" style="margin-top:20px; font-weight:bold;"></p>
      </div>

    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
